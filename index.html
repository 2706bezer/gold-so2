<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standoff Голда</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background-color: #222;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px 0;
    }
    .screenshots {
      display: flex;
      overflow-x: auto;
      gap: 10px;
    }
    .screenshot {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }
    .btn {
      display: block;
      width: 200px;
      margin: 30px auto;
      padding: 15px;
      background-color: #f39c12;
      color: #fff;
      text-align: center;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #e67e22;
    }
  </style>
</head>
<body>
  <header>
    <h1>Мы выдаем голду всем игрокам уже на протяжении полугода</h1>
  </header>

  <div class="container">
    <h2>Скриншоты</h2>
    <div class="screenshots">
      <!-- Здесь будут ваши скриншоты -->
      <img src="screenshot1.jpg" alt="Скриншот 1" class="screenshot">
      <img src="screenshot2.jpg" alt="Скриншот 2" class="screenshot">
      <img src="screenshot3.jpg" alt="Скриншот 3" class="screenshot">
      <!-- Добавьте другие изображения, как нужно -->
    </div>

    <button class="btn" onclick="window.location.href='https://2706bezer.github.io/so2-fun/'">Получить голду</button>
  </div>
</body>
</html>
